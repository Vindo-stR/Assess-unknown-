<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>foot GAME</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        button {
            font-size: 30px;
            padding: 15px 50px;
            border: 0;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<button onclick="startGame()">PLAY 🎮</button>

<audio id="scareSound" src="Young RZ - Extranjero (Official Music Video)(MP3_160K)_1.mp3" preload="auto"></audio>

<script>
function startGame() {
    const audio = document.getElementById("scareSound");

    audio.currentTime = 0;
    audio.volume = 1.0;
    audio.play();

    document.body.innerHTML = `
        <div style="text-align:center">
            <h1>💀 YOU LOST</h1>
        </div>
    `;
}
</script>

</body>
</html>
