<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARA A9RA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #020403;
    color: #69ff8a;
    font-family: monospace;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

/* Cyber grid */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(105,255,138,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(105,255,138,.035) 1px,
            transparent 1px
        );

    background-size: 35px 35px;

    pointer-events: none;
}

/* Scanlines */

body::after {
    content: "";
    position: fixed;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(105,255,138,.05) 4px
        );

    pointer-events: none;
}

.box {
    width: min(90%, 500px);

    padding: 35px 25px;

    border: 1px solid #276b39;

    background: rgba(2,8,4,.94);

    text-align: center;

    box-shadow:
        0 0 35px rgba(0,255,70,.08);
}

.system {
    font-size: 11px;

    letter-spacing: 2px;

    opacity: .5;
}

h1 {
    margin: 25px 0 10px;

    font-size: clamp(35px, 10vw, 60px);

    letter-spacing: 5px;

    text-shadow:
        0 0 20px rgba(105,255,138,.4);
}

.subtitle {
    font-size: 12px;

    letter-spacing: 3px;

    opacity: .55;
}

.line {
    height: 1px;

    background: #276b39;

    margin: 25px 0;
}

.message {
    min-height: 70px;

    color: #caffd5;

    font-size: 14px;

    line-height: 1.8;
}

button {
    margin-top: 20px;

    padding: 13px 30px;

    background: transparent;

    color: #69ff8a;

    border: 1px solid #69ff8a;

    font-family: monospace;

    font-size: 15px;

    cursor: pointer;

    letter-spacing: 2px;
}

button:hover {
    background: #69ff8a;

    color: #020403;

    box-shadow:
        0 0 20px rgba(105,255,138,.4);
}

.footer {
    margin-top: 28px;

    font-size: 9px;

    letter-spacing: 2px;

    opacity: .3;
}
</style>
</head>

<body>

<div class="box">

    <div class="system">
        [ PRIVATE MESSAGE ]
    </div>

    <h1>
        BARA A9RA
    </h1>

    <div class="subtitle">
        YOU FOUND THE LINK
    </div>

    <div class="line"></div>

    <div class="message" id="message">
        اضغط الزر إذا كنت فضوليًا...
    </div>

    <button onclick="reveal()">
        OPEN MESSAGE
    </button>

    <div class="footer">
        0x07 • W//08 • TOUAITI
    </div>

</div>

<script>

function reveal() {

    const message =
        document.getElementById("message");

    message.innerHTML =
        "بـارا اقرا 😏<br><br>" +
        "إذا وصلت لهنا...<br>" +
        "راك فضولي برشا.";

}

</script>

</body>
</html>
